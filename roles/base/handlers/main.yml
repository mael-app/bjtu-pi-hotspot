---
# The nightly conditional-reboot timer (autoupdate role) picks this up.
- name: Schedule a reboot
  ansible.builtin.file:
    path: /run/reboot-required
    state: touch
    mode: "0644"

- name: Re-execute systemd
  ansible.builtin.systemd_service:
    daemon_reexec: true

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
